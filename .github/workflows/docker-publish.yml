name: Build and Push Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate a timestamp for Docker image tagging
      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the Docker image with multiple tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Use the repository root as the Docker build context
          context: .

          # Use the Dockerfile in the repository root
          file: ./Dockerfile

          # Push the built image to Docker Hub
          push: true

          # Build both amd64 and arm64 image variants
          # amd64 works on most Linux servers and Intel/AMD machines
          # arm64 works on Apple Silicon Macs and ARM servers
          platforms: linux/amd64,linux/arm64

          # Push multiple tags for the same image build
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aks-nodepool-monitor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aks-nodepool-monitor:${{ steps.timestamp.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aks-nodepool-monitor:${{ github.sha }}